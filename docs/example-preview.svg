<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI Usage Monitor OBS localhost preview</title>
  <desc id="desc">A dark compact usage overlay showing Codex and Claude bars, with the local settings panel below.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="0.55" stop-color="#12101b"/>
      <stop offset="1" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17151f" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0d0d13" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="codex" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#ffcf92"/>
    </linearGradient>
    <linearGradient id="claude" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f83ff"/>
      <stop offset="1" stop-color="#d6c9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .caps { letter-spacing: 2.6px; }
      .smallcaps { letter-spacing: 1.3px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#page)"/>
  <circle cx="1330" cy="160" r="250" fill="#6e52d8" opacity="0.08"/>
  <circle cx="240" cy="850" r="270" fill="#f2a65a" opacity="0.045"/>

  <g class="ui">
    <text x="92" y="74" fill="#a9a4b7" font-size="14" font-weight="700" class="caps">LOCALHOST PREVIEW</text>
    <text x="1508" y="74" fill="#656171" font-size="13" text-anchor="end" class="smallcaps">OBS BROWSER SOURCE</text>

    <g filter="url(#shadow)">
      <rect x="80" y="108" width="1000" height="312" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="80" y="444" width="1000" height="454" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.13"/>
      <rect x="1130" y="108" width="390" height="790" rx="22" fill="#13131b" stroke="#ffffff" stroke-opacity="0.1"/>
    </g>

    <text x="120" y="154" fill="#f2f0f8" font-size="13" font-weight="700" class="caps">AI USAGE MONITOR</text>
    <circle cx="1000" cy="149" r="6" fill="#7ed49a" filter="url(#glow-orange)"/>
    <text x="1020" y="154" fill="#85818e" font-size="12" font-weight="700" class="smallcaps">REALTIME</text>

    <g>
      <circle cx="124" cy="211" r="7" fill="#f2a65a"/>
      <text x="146" y="217" fill="#f2a65a" font-size="24" font-weight="800" class="smallcaps">CODEX</text>
      <text x="275" y="216" fill="#aaa5b4" font-size="14">(Weekly)</text>
      <text x="1030" y="217" fill="#f7f4fb" font-size="26" font-weight="800" text-anchor="end">7%</text>
      <text x="146" y="246" fill="#a9a4b7" font-size="14" class="mono">gpt-5.6-luna · effort xhigh</text>
      <rect x="120" y="269" width="910" height="13" rx="7" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="120" y="269" width="64" height="13" rx="7" fill="url(#codex)" filter="url(#glow-orange)"/>
      <text x="120" y="315" fill="#b8b4c2" font-size="14">weekly · resets in 1d 19h</text>
    </g>

    <g>
      <circle cx="124" cy="351" r="7" fill="#b69bff"/>
      <text x="146" y="357" fill="#cfc3ff" font-size="24" font-weight="800" class="smallcaps">CLAUDE</text>
      <text x="292" y="356" fill="#aaa5b4" font-size="14">(Session)</text>
      <text x="1030" y="357" fill="#f7f4fb" font-size="26" font-weight="800" text-anchor="end">0%</text>
      <text x="146" y="386" fill="#a9a4b7" font-size="14" class="mono">Claude Opus 5 · effort high</text>
      <rect x="120" y="409" width="910" height="13" rx="7" fill="#ffffff" fill-opacity="0.14"/>
    </g>

    <text x="120" y="489" fill="#8f8a9d" font-size="12" font-weight="700" class="caps">LOCAL SETTINGS</text>
    <text x="120" y="528" fill="#f4f2f8" font-size="25" font-weight="600">Overlay settings</text>
    <text x="1038" y="527" fill="#85818e" font-size="13" text-anchor="end">Crop OBS above this section</text>

    <g fill="#bcb8c6" font-size="14">
      <text x="120" y="578">Background opacity</text>
      <text x="548" y="578">Bar height</text>
      <text x="120" y="654">Text size</text>
    </g>
    <g fill="#817d8e" font-size="13" text-anchor="end">
      <text x="500" y="578">82%</text>
      <text x="928" y="578">7px</text>
      <text x="500" y="654">100%</text>
    </g>
    <g stroke="#6f697f" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="610" x2="500" y2="610"/>
      <line x1="548" y1="610" x2="928" y2="610"/>
      <line x1="120" y1="686" x2="500" y2="686"/>
    </g>
    <g fill="#b69bff">
      <circle cx="431" cy="610" r="10"/>
      <circle cx="650" cy="610" r="10"/>
      <circle cx="264" cy="686" r="10"/>
    </g>

    <text x="120" y="746" fill="#bcb8c6" font-size="14">Visible models</text>
    <text x="120" y="771" fill="#817d8e" font-size="12">Detected tools are marked live or detected; optional rows start hidden.</text>

    <g font-size="13" font-weight="700" class="smallcaps">
      <g>
        <rect x="120" y="792" width="388" height="50" rx="9" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.16"/>
        <rect x="140" y="810" width="15" height="15" rx="3" fill="#b69bff"/>
        <path d="M143 817l4 4 7-9" fill="none" stroke="#17151f" stroke-width="2"/>
        <circle cx="178" cy="817" r="5" fill="#f2a65a"/>
        <text x="194" y="822" fill="#ddd9e7">CODEX</text>
        <text x="488" y="822" fill="#7ed49a" text-anchor="end" font-size="10">LIVE</text>
      </g>
      <g>
        <rect x="528" y="792" width="388" height="50" rx="9" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.16"/>
        <rect x="548" y="810" width="15" height="15" rx="3" fill="#b69bff"/>
        <path d="M551 817l4 4 7-9" fill="none" stroke="#17151f" stroke-width="2"/>
        <circle cx="586" cy="817" r="5" fill="#b69bff"/>
        <text x="602" y="822" fill="#ddd9e7">CLAUDE</text>
        <text x="896" y="822" fill="#7ed49a" text-anchor="end" font-size="10">LIVE</text>
      </g>
    </g>

    <g>
      <text x="1170" y="170" fill="#8f8a9d" font-size="12" font-weight="700" class="caps">WHY IT IS USEFUL</text>
      <text x="1170" y="224" fill="#f4f2f8" font-size="25" font-weight="600">Small by design.</text>
      <text x="1170" y="256" fill="#aaa5b4" font-size="15">Keep your OBS scene clear</text>
      <text x="1170" y="280" fill="#aaa5b4" font-size="15">while watching limits in real time.</text>
      <line x1="1170" y1="316" x2="1480" y2="316" stroke="#ffffff" stroke-opacity="0.1"/>
      <g font-size="14">
        <circle cx="1184" cy="363" r="5" fill="#7ed49a"/>
        <text x="1204" y="368" fill="#ddd9e7">Localhost only</text>
        <circle cx="1184" cy="416" r="5" fill="#f2a65a"/>
        <text x="1204" y="421" fill="#ddd9e7">Live percentage bars</text>
        <circle cx="1184" cy="469" r="5" fill="#b69bff"/>
        <text x="1204" y="474" fill="#ddd9e7">Model and effort labels</text>
        <circle cx="1184" cy="522" r="5" fill="#69d4c6"/>
        <text x="1204" y="527" fill="#ddd9e7">Optional agent detection</text>
      </g>
      <rect x="1170" y="604" width="310" height="150" rx="14" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="1194" y="643" fill="#8f8a9d" font-size="11" font-weight="700" class="caps">OBS TIP</text>
      <text x="1194" y="681" fill="#f4f2f8" font-size="16">Crop above the settings</text>
      <text x="1194" y="707" fill="#a9a4b7" font-size="14">to show only the overlay.</text>
      <text x="1194" y="733" fill="#a9a4b7" font-size="14">Use the same localhost URL.</text>
    </g>
  </g>
</svg>
